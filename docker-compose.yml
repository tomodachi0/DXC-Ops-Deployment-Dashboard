version: "3.9"

services:
  backend:
    build: ./backend
    container_name: dxc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          
    environment:
      - PYTHONUNBUFFERED=1    
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dxc-frontend
    ports:
      - "8080:80"               
    depends_on:
      - backend
    restart: unless-stopped