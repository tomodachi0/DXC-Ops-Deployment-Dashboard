name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  all:
    runs-on: self-hosted
    permissions:
      contents: write     
      packages: write 
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest httpx bandit

      - name: Lint code
        run: flake8 .

      - name: Run Bandit SAST scan
        run: bandit -r . -f screen --exclude ./venv,./.venv

      - name: Run tests
        run: pytest

      - name: Get short commit SHA
        working-directory: .
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build backend image
        working-directory: .
        run: docker build -t dxc-backend:ci-test ./backend

      - name: Build frontend image
        working-directory: .
        run: docker build -t dxc-frontend:ci-test ./frontend

      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dxc-backend:ci-test
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dxc-frontend:ci-test
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Trivy config scan - k8s manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: k8s/
          severity: CRITICAL,HIGH
          exit-code: 0