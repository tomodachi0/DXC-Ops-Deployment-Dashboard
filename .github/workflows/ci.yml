name: CI

on:
  pull_request:
    branches: [main]

jobs:
  all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Lint code
        run: ruff check --output-format=github .

      - name: Run tests
        run: pytest

      - name: Build backend image
        working-directory: .
        run: docker build -t dxc-backend:ci-test ./backend

      - name: Build frontend image
        working-directory: .
        run: docker build -t dxc-frontend:ci-test ./frontend

      - name: Update image tag in manifest
        run: |
          sed -i "s|backend:.*|backend:${{ env.SHA_SHORT }}|" k8s/backend/deployment.yaml
          sed -i "s|frontend:.*|frontend:${{ env.SHA_SHORT }}|" k8s/frontend/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          git commit -m "Deploy commit ${{ env.SHA_SHORT }}" || echo "No changes to commit"
          git push
          