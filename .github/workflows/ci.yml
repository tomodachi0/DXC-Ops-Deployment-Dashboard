name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  all:
    runs-on: ubuntu-latest
    permissions:
      contents: write     
      packages: write 
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Lint code
        run: ruff check --output-format=github .

      - name: Run tests
        run: pytest

      - name: Build backend image
        working-directory: .
        run: docker build -t dxc-backend:ci-test ./backend

      - name: Build frontend image
        working-directory: .
        run: docker build -t dxc-frontend:ci-test ./frontend


          