name: Publish Images

on:
  push:
    branches: [dev]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit SHA
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/backend:${{ env.SHA_SHORT }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/frontend:${{ env.SHA_SHORT }}

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: ghcr.io/.*/backend:.*|image: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/backend:${{ env.SHA_SHORT }}|" k8s/backend/deployment.yaml
          sed -i "s|image: ghcr.io/.*/frontend:.*|image: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/frontend:${{ env.SHA_SHORT }}|" k8s/frontend/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          git commit -m "Deploy commit ${{ env.SHA_SHORT }}" || echo "No changes to commit"
          git push origin dev

      - name: Verify image tags were set correctly
        run: |
          grep "image: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/backend:${{ env.SHA_SHORT }}" k8s/backend/deployment.yaml
          grep "image: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/frontend:${{ env.SHA_SHORT }}" k8s/frontend/deployment.yaml