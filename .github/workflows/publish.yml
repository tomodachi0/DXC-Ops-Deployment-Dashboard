name: Publish Images

on:
  push:
    branches: [main, dev]

jobs:
  publish:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
      issues: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short commit SHA
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/backend:${{ github.ref_name }}-${{ env.SHA_SHORT }}

      - name: Start backend for DAST scan
        run: |
          docker run -d -p 8000:8000 --name dast-target ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/backend:${{ github.ref_name }}-${{ env.SHA_SHORT }}
          sleep 8
          curl -f http://localhost:8000/api/health

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 -m 2 -I || true

      - name: Stop DAST target container
        if: always()
        run: docker stop dast-target

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/frontend:${{ github.ref_name }}-${{ env.SHA_SHORT }}

      - name: Update image tag in overlay
        run: |
          OVERLAY_ENV=dev
          if [ "${{ github.ref_name }}" = "main" ]; then OVERLAY_ENV=production; fi
          echo "OVERLAY_ENV=$OVERLAY_ENV" >> $GITHUB_ENV

          sed -i "s|newTag: .*|newTag: ${{ github.ref_name }}-${{ env.SHA_SHORT }}|" k8s/overlays/$OVERLAY_ENV/kustomization.yaml

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/overlays/$OVERLAY_ENV/kustomization.yaml
          git commit -m "Deploy ${{ github.ref_name }} commit ${{ env.SHA_SHORT }}" || echo "No changes to commit"
          git push origin ${{ github.ref_name }}

      - name: Verify image tag was set correctly
        run: |
          grep "newTag: ${{ github.ref_name }}-${{ env.SHA_SHORT }}" k8s/overlays/${{ env.OVERLAY_ENV }}/kustomization.yaml