apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dxc-dashboard-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tomodachi0/dxc-ops-deployment-dashboard.git
    targetRevision: dev
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dxc-dashboard-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true