apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dxc-dashboard-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tomodachi0/dxc-ops-deployment-dashboard.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: dxc-dashboard-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true