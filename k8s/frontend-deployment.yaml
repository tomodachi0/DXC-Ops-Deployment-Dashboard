apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxc-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dxc-frontend
  template:
    metadata:
      labels:
        app: dxc-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/tomodachi0/dxc-ops-deployment-dashboard/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dxc-frontend-service
spec:
  selector:
    app: dxc-frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort