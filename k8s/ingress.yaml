apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dxc-dashboard-ingress
  namespace: dxc-dashboard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: dxc.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dxc-backend-service
                port:
                  number: 8000
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dxc-frontend-service
                port:
                  number: 80